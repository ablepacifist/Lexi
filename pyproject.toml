[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexi"
version = "0.0.1"
description = "Obrenna's voice edge — local STT/TTS/wake/VAD on aragon; text-only to the brain on alison."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The mic-side engine stack. Installed on the aragon device only.
# Pinned, not floating: piper-tts changed its synthesis API between 1.2 and 1.3
# (``synthesize_stream_raw`` was replaced by ``synthesize`` yielding AudioChunk),
# so an unpinned upgrade silently breaks TTS at runtime rather than at install.
engines = [
    "faster-whisper==1.2.1",
    "piper-tts==1.7.0",
    "openwakeword==0.6.0",
    # NOT `webrtcvad`: no Windows wheel, needs a C compiler. This fork ships
    # wheels and provides the same `webrtcvad` module.
    "webrtcvad-wheels==2.0.14",
    "sounddevice==0.5.6",
    "numpy==2.4.6",
]
dev = ["pytest>=8"]

[project.scripts]
lexi = "lexi.__main__:main"

[tool.setuptools.packages.find]
include = ["lexi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
