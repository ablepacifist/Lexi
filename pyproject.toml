[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexi"
version = "0.0.1"
description = "Obrenna's voice edge — local STT/TTS/wake/VAD on aragon; text-only to the brain on alison."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The mic-side engine stack. Installed on the aragon device only.
engines = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "openwakeword>=0.6",
    "webrtcvad>=2.0.10",
    "sounddevice>=0.4",
    "numpy>=1.26",
]
dev = ["pytest>=8"]

[project.scripts]
lexi = "lexi.__main__:main"

[tool.setuptools.packages.find]
include = ["lexi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
