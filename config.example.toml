# Lexi config. Copy to config.toml and edit for the aragon device.
# Secrets do NOT live here — the gateway shared secret comes from
# $OBRENNA_AGENT_TOKEN or ./.agent_token (see [agent token] note at bottom).

[brain]
# Reach Obrenna's gateway on alison. Tunnel first, LAN as fallback.
# Destinations (tunnel_base_url, lan_base_url) come from the env registry now
# — PUBLIC_BRAIN_URL / ALISON_LAN_IP+BRAIN_LAN_PORT in the root .env, or
# Lexi/.env for a standalone checkout — not from this file. See
# Lexi/.env.example.
orchestrator = "qwen3.5-4b-claude-opus-reasoning-distilled-v2"
workers_enabled = false
request_timeout_s = 120.0
connect_timeout_s = 3.0

[identity]
# Lexicon owns identity. Lexi resolves the speaking user to an account_id the
# brain scopes memory by. lexicon_base_url comes from the env registry now
# (LEXICON_PORT, composed as http://127.0.0.1:<port>) — not from this file.
# See Lexi/.env.example.
default_account_id = "local-default"   # used when no Lexicon session is present

[engines]
# Measured on aragon (Ryzen 7 PRO 4750U, CPU int8, warm model, 2.7 s clip).
# Model load is ~1-4 s once at startup and is excluded:
#
#   tiny.en   0.40 s   RTF 0.15x
#   base.en   1.00 s   RTF 0.37x   <- default: same accuracy as base, 27% faster
#   base      1.37 s   RTF 0.50x
#   small.en  2.43 s   RTF 0.89x
#
# The `.en` variants are English-only builds of the same weights — strictly
# better here than the multilingual ones. Drop to tiny.en if latency matters
# more than accuracy; go up to small.en once STT moves to alison's GPU.
stt_model = "base.en"       # faster-whisper size (tiny.en|base.en|small.en) or a path
stt_device = "cpu"
stt_compute_type = "int8"
# stt_language = "en"       # omit to autodetect
tts_voice = "en_US-lessac-medium"
wake_enabled = true
wake_model = "hey_jarvis"   # openWakeWord model (swap for a custom "Hey Obrenna")
wake_threshold = 0.5
vad_aggressiveness = 2      # 0..3
sample_rate = 16000
models_dir = "./models"

# agent_token_env = "OBRENNA_AGENT_TOKEN"
# agent_token_file = "./.agent_token"
